<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>只读聊天 · 图标样式预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#292a2d;font:14px/1.5 system-ui;color:#eee}main{max-width:900px;margin:40px auto;padding:20px}h1{font-size:20px;font-weight:500}p{color:#aaa}section{margin:26px 0}h2{font-size:13px;font-weight:400;color:#bbb}.sample{background:#f4f0e6;color:#232219;border-radius:12px;overflow:hidden}.bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:16px 44px;border-bottom:1px solid #d8cfbb;font-size:13px}.bar>span{flex:1}.bar button{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;padding:6px;border:0;border-radius:8px;background:transparent;color:#6e6857;cursor:pointer}.bar button:hover{color:#232219;background:#e9e3d5}.bar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.content{padding:24px 44px;color:#6e6857}.dark{background:#1c1b19;color:#ede9df}.dark .bar{border-color:#3b372f}.dark button{color:#a8a192}.dark button:hover{color:#ede9df;background:#2a2825}.dark .content{color:#a8a192}@media(max-width:600px){main{margin:12px auto;padding:12px}.bar{padding:16px 20px}.content{padding:24px 20px}}
</style><main><h1>只读聊天图标预览</h1><p>静态展示 · 不连接 API · 按钮仅展示外观和悬停效果</p>
<section><h2>生成中：返回原聊天 / 停止生成</h2><div class="sample"><div class="bar"><span>原聊天正在生成 · 当前仅供阅读</span><button title="返回原聊天" aria-label="返回原聊天"><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(3 3) scale(.75)"><path d="m6 3-4 4 4 4M2 7h12a7 7 0 0 1 0 14h-2"/><g fill="currentColor" stroke="none"><circle cx="2" cy="21" r="1"/><circle cx="5" cy="21" r="1"/><circle cx="8" cy="21" r="1"/></g></g></svg></button><button title="停止生成" aria-label="停止生成"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor" stroke="none"/></svg></button></div><div class="content">这里是其他聊天的历史记录预览。</div></div></section>
<section><h2>生成完成：返回原聊天 / 退出预览</h2><div class="sample"><div class="bar"><span>只读预览 · 可打开聊天继续操作</span><button title="返回原聊天" aria-label="返回原聊天"><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(3 3) scale(.75)"><path d="m6 3-4 4 4 4M2 7h12a7 7 0 0 1 0 14h-2"/><g fill="currentColor" stroke="none"><circle cx="2" cy="21" r="1"/><circle cx="5" cy="21" r="1"/><circle cx="8" cy="21" r="1"/></g></g></svg></button><button title="退出预览" aria-label="退出预览"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="content">叉号保留“打开此聊天”的功能含义。</div></div></section>
<section><h2>夜间效果</h2><div class="sample dark"><div class="bar"><span>原聊天正在生成 · 当前仅供阅读</span><button title="返回原聊天" aria-label="返回原聊天"><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(3 3) scale(.75)"><path d="m6 3-4 4 4 4M2 7h12a7 7 0 0 1 0 14h-2"/><g fill="currentColor" stroke="none"><circle cx="2" cy="21" r="1"/><circle cx="5" cy="21" r="1"/><circle cx="8" cy="21" r="1"/></g></g></svg></button><button title="停止生成" aria-label="停止生成"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor" stroke="none"/></svg></button></div><div class="content">相同尺寸与线条，跟随暖纸夜间配色。</div></div></section></main></html>
