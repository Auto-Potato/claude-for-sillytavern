<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暖纸 · 通知配色色卡</title><style>
*{box-sizing:border-box}body{margin:0;background:#292a2d;color:#35332c;font:15px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1000px;margin:32px auto;padding:24px}h1{color:#f3efe4;font-size:24px;font-weight:500;margin:0 0 8px}p{color:#b8b2a6;margin:0 0 24px}.scene{background:#f4f0e5;padding:28px;border-radius:16px;margin-bottom:20px}.scene.dark{background:#201f1b;color:#eee9df}.scene h2{font-size:14px;font-weight:400;margin:0 0 20px;opacity:.7}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.toast{display:flex;align-items:center;gap:14px;background:var(--color);color:#fffaf0;padding:18px 20px;border-radius:9px;box-shadow:0 4px 12px #0002;font-weight:500}.toast svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.code{font:12px/1.5 monospace;opacity:.65;margin:8px 4px}.success{--color:#65765B}.info{--color:#5D7880}.warning{--color:#98703D}.error{--color:#A65F4D}@media(max-width:600px){main{padding:16px;margin:8px auto}.scene{padding:20px}.grid{grid-template-columns:1fr}}</style><main><h1>暖纸 · 通知配色</h1><p>低饱和的苔绿、灰蓝、赭金与陶红，搭配暖白文字。色卡固定展示，方便比较。</p><div id="samples"></div></main><script>
const items=[['success','成功 · 操作已完成','#65765B','<path d="m4 12 5 5L20 6"/>'],['info','信息 · 脚本加载成功','#5D7880','<circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7" r="1" fill="currentColor" stroke="none"/>'],['warning','警告 · 请检查设置','#98703D','<path d="M12 3 2 21h20ZM12 9v5"/><circle cx="12" cy="17.5" r="1" fill="currentColor" stroke="none"/>'],['error','错误 · API 连接失败','#A65F4D','<circle cx="12" cy="12" r="9"/><path d="m8 8 8 8m0-8-8 8"/>']];
document.getElementById('samples').innerHTML=['日间背景','夜间背景'].map((label,i)=>`<section class="scene ${i?'dark':''}"><h2>${label}</h2><div class="grid">${items.map(([kind,title,hex,svg])=>`<div><div class="toast ${kind}"><svg viewBox="0 0 24 24">${svg}</svg><span>${title}</span></div><div class="code">${hex}</div></div>`).join('')}</div></section>`).join('');
</script></html>
